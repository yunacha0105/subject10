[project]
name = "subject10-pose-action"
version = "0.1.0"
description = "Subject 10 - 2D Pose Estimation and Action Analysis"
requires-python = ">=3.11"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "torch",
    "tqdm",
    "django>=5.2.19",
    "djangorestframework>=3.18.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
